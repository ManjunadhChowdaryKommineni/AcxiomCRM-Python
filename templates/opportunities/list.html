{% extends 'base.html' %}{% block content %}<h2>Opportunities</h2><div class="card p-3 mb-4"><form method="post" action="/opportunities/create" class="row g-2"><input class="form-control col" name="opportunity_name" placeholder="Opportunity name" required><input class="form-control col" name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required><select class="form-select col" name="stage">{% for s in stages %}<option>{{s}}</option>{% endfor %}</select><input class="form-control col" name="probability" type="number" min="0" max="100" value="50" placeholder="Probability"><input class="form-control col" name="expected_close_date" type="date" required><input class="form-control col" name="notes" placeholder="Notes"><button class="btn btn-primary">Add Opportunity</button></form></div><table class="table table-striped"><tr><th>Name</th><th>Amount</th><th>Stage</th><th>Probability</th><th>Weighted</th><th>Close</th></tr>{% for x in opportunities %}<tr><td>{{x.opportunity_name}}</td><td>{{x.amount}}</td><td>{{x.stage}}</td><td>{{x.probability}}%</td><td>{{(x.amount*x.probability/100)|round(2)}}</td><td>{{x.expected_close_date}}</td></tr>{% endfor %}</table>{% endblock %}
