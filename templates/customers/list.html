{% extends 'base.html' %}{% block content %}<h2>Customers</h2><form class="row g-2 mb-3"><div class="col"><input name="q" value="{{q}}" class="form-control" placeholder="Search name/email/phone"></div><div class="col-auto"><button class="btn btn-secondary">Search</button></div></form><div class="card p-3 mb-4"><h5>Add Customer</h5><form method="post" action="/customers/create" class="row g-2"><input class="col form-control" name="customer_name" placeholder="Name" required><input class="col form-control" name="email" type="email" placeholder="Email" required><input class="col form-control" name="phone" placeholder="Phone" required><input class="col form-control" name="company_name" placeholder="Company" required><input class="col form-control" name="city" placeholder="City"><input class="col form-control" name="state" placeholder="State"><button class="btn btn-primary">Add</button></form></div><table class="table table-striped"><tr><th>Code</th><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Status</th></tr>{% for c in customers %}<tr><td>{{c.customer_code}}</td><td>{{c.customer_name}}</td><td>{{c.email}}</td><td>{{c.phone}}</td><td>{{c.company_name}}</td><td>{{c.status}}</td></tr>{% endfor %}</table>{% endblock %}
