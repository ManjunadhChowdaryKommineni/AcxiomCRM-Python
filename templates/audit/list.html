{% extends 'base.html' %}{% block content %}<h2>Audit Log</h2><table class="table table-sm table-striped"><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Record</th><th>Result</th><th>Details</th></tr>{% for x in logs %}<tr><td>{{x.created_date}}</td><td>{{x.user_id}}</td><td>{{x.action}}</td><td>{{x.entity_name}}</td><td>{{x.record_id}}</td><td>{{x.result}}</td><td>{{x.details or ''}}</td></tr>{% endfor %}</table>{% endblock %}
