{% extends 'base.html' %}{% block content %}<h2>User & Role Management</h2><div class="card p-3 mb-4"><form method="post" action="/users/create" class="row g-2"><input class="form-control col" name="name" placeholder="Name" required><input class="form-control col" name="email" type="email" placeholder="Email" required><input class="form-control col" name="password" type="password" placeholder="Password" required minlength="8"><select class="form-select col" name="role"><option>SalesExecutive</option><option>Manager</option><option>Admin</option></select><button class="btn btn-primary">Create User</button></form></div><table class="table"><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{u.is_active}}</td></tr>{% endfor %}</table>{% endblock %}
