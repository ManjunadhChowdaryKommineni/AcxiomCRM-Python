{% extends 'base.html' %}{% block content %}<h2>Leads</h2><form class="mb-3"><input name="q" value="{{q}}" class="form-control" placeholder="Search lead/email"></form><div class="card p-3 mb-4"><form method="post" action="/leads/create" class="row g-2"><input class="form-control col" name="lead_name" placeholder="Lead name" required><input class="form-control col" name="email" type="email" placeholder="Email" required><input class="form-control col" name="phone" placeholder="Phone" required><input class="form-control col" name="company_name" placeholder="Company"><select class="form-select col" name="status">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select><input class="form-control col" name="expected_value" type="number" min="0" value="0"><button class="btn btn-primary">Add Lead</button></form></div><table class="table table-striped"><tr><th>Code</th><th>Name</th><th>Email</th><th>Status</th><th>Priority</th><th>Value</th></tr>{% for x in leads %}<tr><td>{{x.lead_code}}</td><td>{{x.lead_name}}</td><td>{{x.email}}</td><td>{{x.status}}</td><td>{{x.priority}}</td><td>{{x.expected_value}}</td></tr>{% endfor %}</table>{% endblock %}
