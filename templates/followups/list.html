{% extends 'base.html' %}{% block content %}<h2>Follow-ups</h2><div class="card p-3 mb-4"><form method="post" action="/followups/create" class="row g-2"><input class="form-control col" name="follow_up_date" type="date" required><select class="form-select col" name="follow_up_type"><option>Call</option><option>Meeting</option><option>Email</option><option>Task</option></select><input class="form-control col" name="subject" placeholder="Subject" required><input class="form-control col" name="remarks" placeholder="Remarks"><button class="btn btn-primary">Schedule</button></form></div><table class="table"><tr><th>Date</th><th>Type</th><th>Subject</th><th>Status</th></tr>{% for x in followups %}<tr><td>{{x.follow_up_date}}</td><td>{{x.follow_up_type}}</td><td>{{x.subject}}</td><td>{{x.status}}</td></tr>{% endfor %}</table>{% endblock %}
