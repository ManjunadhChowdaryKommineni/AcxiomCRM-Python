{% extends 'base.html' %}{% block content %}<h2>Activities</h2><div class="card p-3 mb-4"><form method="post" action="/activities/create" class="row g-2"><select class="form-select col" name="activity_type"><option>Call</option><option>Meeting</option><option>Email</option><option>Task</option></select><input class="form-control col" name="subject" placeholder="Subject" required><input class="form-control col" name="activity_date" type="date" required><input class="form-control col" name="description" placeholder="Description"><button class="btn btn-primary">Add Activity</button></form></div><table class="table"><tr><th>Type</th><th>Subject</th><th>Date</th><th>Status</th></tr>{% for x in activities %}<tr><td>{{x.activity_type}}</td><td>{{x.subject}}</td><td>{{x.activity_date}}</td><td>{{x.status}}</td></tr>{% endfor %}</table>{% endblock %}
